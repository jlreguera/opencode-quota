<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title description">
  <title id="title">Quota status above the prompt</title>
  <desc id="description">Example quota bars and reset times for the current model, above the OpenCode prompt.</desc>
  <rect width="600" height="260" fill="#000000"/>
  <g font-family="monospace" font-size="18">
    <text x="48" y="42" fill="#5da9ff">Build</text>
    <text x="114" y="42" fill="#808080">· Example Model · 6.9s · 7.3 tok/s</text>
    <g fill="#80d893">
      <text x="37" y="94">5h</text>
      <text x="191" y="94">1h09m</text>
      <text x="301" y="94">wk</text>
      <text x="455" y="94">6d7h</text>
    </g>
    <text x="268" y="94" fill="#808080">·</text>
    <rect x="70" y="74" width="110" height="26" fill="#494949"/>
    <rect x="70" y="74" width="33" height="26" fill="#80d893"/>
    <rect x="334" y="74" width="110" height="26" fill="#494949"/>
    <rect x="334" y="74" width="11" height="26" fill="#80d893"/>
    <g fill="#e7e7e7" text-anchor="middle">
      <text x="125" y="94">30%</text>
      <text x="389" y="94">9%</text>
    </g>
    <rect x="19" y="100" width="565" height="117" fill="#1f1f1f"/>
    <rect x="19" y="100" width="3" height="117" fill="#5da9ff"/>
    <rect x="48" y="126" width="10" height="25" fill="none" stroke="#e7e7e7"/>
    <text x="48" y="198" fill="#5da9ff">Build</text>
    <text x="114" y="198" fill="#808080">·</text>
    <text x="136" y="198" fill="#e7e7e7">Example Model</text>
    <text x="290" y="198" fill="#808080">OpenAI</text>
    <text x="15" y="250" fill="#808080">~/project</text>
  </g>
</svg>
