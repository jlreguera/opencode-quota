name: Publish to npm

on:
  push:
    branches: [master]
permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous=$(git show "$BEFORE:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          current=$(node -p 'require("./package.json").version')
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "$previous" = "$current" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git check-ref-format "refs/tags/v$current"
            if git show-ref --verify --quiet "refs/tags/v$current"; then
              echo "Tag v$current already exists" >&2
              exit 1
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.changed == 'true'
        run: npm pack --dry-run
      - if: steps.version.outputs.changed == 'true'
        run: npm publish
      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
